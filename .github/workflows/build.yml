name: Build geoip files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 4"
  push:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Set variables
        shell: bash
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Download GeoLite2 ASN Database
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          mkdir -p output

          curl -L \
          "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${LICENSE_KEY}&suffix=tar.gz" \
          -o output/GeoLite2-ASN.tar.gz

          tar -xzf output/GeoLite2-ASN.tar.gz -C output

          mv output/GeoLite2-ASN_*/GeoLite2-ASN.mmdb ./GeoLite2-ASN.mmdb

          cp GeoLite2-ASN.mmdb output/ASN.mmdb


      - name: Fetch and Merge CIDR
        run: |
          mkdir -p geolite2 tools_temp data_temp

          echo "Downloading IPv4 CN routes..."
          curl -sL \
          https://raw.githubusercontent.com/misakaio/chnroutes2/master/chnroutes.txt \
          > data_temp/cn_ipv4.txt


          echo "Downloading IPv6 CN routes..."
          curl -sL \
          https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt \
          > data_temp/cn_ipv6.txt


          cat > data_temp/private.txt <<'EOF'
0.0.0.0/8
10.0.0.0/8
100.64.0.0/10
127.0.0.0/8
169.254.0.0/16
172.16.0.0/12
192.0.0.0/24
192.0.2.0/24
192.88.99.0/24
192.168.0.0/16
198.18.0.0/15
198.51.100.0/24
203.0.113.0/24
224.0.0.0/4
240.0.0.0/4
255.255.255.255/32
::/128
::1/128
::ffff:0:0/96
64:ff9b::/96
100::/64
2001::/32
2001:db8::/32
fc00::/7
fe80::/10
ff00::/8
EOF


          cat \
          data_temp/cn_ipv4.txt \
          data_temp/cn_ipv6.txt \
          data_temp/private.txt \
          | tr -d ' \t\r' \
          | grep -v '^#' \
          | grep -v '^$' \
          > data_temp/all_cidr.txt


          echo "CIDR count:"
          wc -l data_temp/all_cidr.txt


          cd tools_temp

          go mod init merge
          go get go4.org/netipx


          cat > do_merge.go <<'EOF'
package main

import (
	"bufio"
	"fmt"
	"log"
	"net/netip"
	"os"
	"strings"

	"go4.org/netipx"
)

func main() {

	file, err := os.Open("../data_temp/all_cidr.txt")
	if err != nil {
		log.Fatal(err)
	}
	defer file.Close()


	var builder netipx.IPSetBuilder


	scanner := bufio.NewScanner(file)

	for scanner.Scan() {

		line := strings.TrimSpace(scanner.Text())

		if line == "" || strings.HasPrefix(line, "#") {
			continue
		}

		prefix, err := netip.ParsePrefix(line)

		if err == nil {
			builder.AddPrefix(prefix)
		}
	}


	ipSet, err := builder.IPSet()

	if err != nil {
		log.Fatal(err)
	}


	out, err := os.Create("../geolite2/chinamax_cidr.txt")

	if err != nil {
		log.Fatal(err)
	}

	defer out.Close()


	prefixes := ipSet.Prefixes()

	for _, p := range prefixes {
		out.WriteString(p.String()+"\n")
	}


	fmt.Printf(
		"merged prefixes: %d\n",
		len(prefixes),
	)
}
EOF


          go run do_merge.go

          cd ..

          rm -rf tools_temp data_temp


          wc -l geolite2/chinamax_cidr.txt

          test -s geolite2/chinamax_cidr.txt


      - name: Build Country.mmdb
        run: |
          go build .
          ./geoip convert -c ./config.json


      - name: Clean output
        run: |
          cd output || exit 1

          find . \
          -type f \
          ! -name "ASN.mmdb" \
          ! -name "Country.mmdb" \
          -delete


      - name: Verify mmdb
        run: |
          cd output || exit 1

          go install github.com/maxmind/mmdbverify@latest

          for file in *.mmdb
          do
            $(go env GOPATH)/bin/mmdbverify -file "$file"
          done


      - name: Generate SHA256
        run: |
          cd output || exit 1

          for file in *.mmdb
          do
            sha256sum "$file" > "$file.sha256sum"
          done


      - name: Push release branch
        run: |
          cd output || exit 1

          git init

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b release

          git add .

          git commit -m "${{ env.RELEASE_NAME }}"

          git remote add geoip \
          "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          git push -f -u geoip release


      - name: Purge jsdelivr CDN
        run: |
          cd output || exit 1

          for file in *.mmdb
          do
            curl -i \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$file"
          done


      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Upload GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./output/*
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          overwrite: true
