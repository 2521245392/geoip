name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 4"
  push:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      - name: Download GeoLite2 Databases
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          mkdir -p output
          
          # 下载 ASN 数据库备用
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${LICENSE_KEY}&suffix=tar.gz" -o ./output/GeoLite2-ASN.tar.gz
          tar -xvzf ./output/GeoLite2-ASN.tar.gz -C ./output
          mv ./output/GeoLite2-ASN_*/GeoLite2-ASN.mmdb ./GeoLite2-ASN.mmdb
          cp ./GeoLite2-ASN.mmdb ./output/ASN.mmdb

      - name: Fetch Pure Physical China & Private CIDR
        run: |
          mkdir -p ./geolite2
          mkdir -p ./temp_cidr

          echo "📥 1. 正在拉取国内骨干网 BGP 真实广播的 IPv4 (chnroutes2)..."
          curl -sL "https://raw.githubusercontent.com/misakaio/chnroutes2/master/chnroutes.txt" > ./temp_cidr/raw_cn4.txt
          echo "" >> ./temp_cidr/raw_cn4.txt # 防止源文件末尾无换行符导致粘连

          echo "📥 2. 正在拉取纯物理大陆运营商 IPv6 路由段..."
          curl -sL "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt" > ./temp_cidr/raw_cn6.txt
          echo "" >> ./temp_cidr/raw_cn6.txt # 防止源文件末尾无换行符导致粘连

          echo "📝 3. 正在生成兼容性标准的 IPv4 / IPv6 保留与私网 CIDR..."
          cat << 'EOF' > ./temp_cidr/raw_private.txt
          0.0.0.0/8
          10.0.0.0/8
          100.64.0.0/10
          127.0.0.0/8
          169.254.0.0/16
          172.16.0.0/12
          192.0.0.0/24
          192.0.2.0/24
          192.88.99.0/24
          192.168.0.0/16
          198.18.0.0/15
          198.51.100.0/24
          203.0.113.0/24
          224.0.0.0/4
          240.0.0.0/4
          ::ffff:0:0/96
          64:ff9b::/96
          100::/64
          2001::/32
          2001:db8::/32
          fc00::/7
          fe80::/10
          ff00::/8
          EOF

          echo "🧹 4. 执行终极正则提取 (彻底免疫 BOM、空行和乱码)..."
          cat ./temp_cidr/raw_cn4.txt ./temp_cidr/raw_cn6.txt ./temp_cidr/raw_private.txt > ./temp_cidr/merged.txt
          
          # 核心修复：只提取绝对合法的 [IP/掩码] 字符串，直接剥离所有隐形非法字符
          cat ./temp_cidr/merged.txt | grep -v '^#' | grep -oE '[0-9a-fA-F:\.]+/[0-9]{1,3}' > ./geolite2/chinamax_cidr.txt

          rm -rf ./temp_cidr

          echo "Cleaned CIDR count:"
          wc -l ./geolite2/chinamax_cidr.txt
          test -s ./geolite2/chinamax_cidr.txt

      - name: Build Country.mmdb
        run: |
          go build ./
          ./geoip convert -c ./config.json

      - name: Clean output directory
        run: |
          cd ./output || exit 1
          find . -type f ! -name "ASN.mmdb" ! -name "Country.mmdb" -delete

      - name: Verify mmdb files
        run: |
          cd ./output || exit 1
          go install -v github.com/maxmind/mmdbverify@latest
          for name in $(ls *.mmdb); do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done

      - name: Generate sha256 checksum
        run: |
          cd ./output || exit 1
          for name in $(ls *.mmdb); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      - name: Git push assets to "release" branch
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add geoip "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u geoip release

      - name: Purge jsdelivr CDN
        run: |
          cd output || exit 1
          for file in $(ls *.mmdb); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./output/*
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          overwrite: true
